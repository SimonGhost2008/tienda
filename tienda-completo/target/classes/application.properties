spring.application.name=tienda-completo
server.port=8080

# --- Conexión a MariaDB/MySQL (el conector mysql-connector-j funciona con ambos) ---
spring.datasource.url=jdbc:mysql://localhost:3306/tienda?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=12345678910

# --- Hibernate / JPA ---
# update: Hibernate crea/ajusta la tabla "producto" a partir de la entidad
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true